openapi: 3.0.3
info:
  title: HustleHub+ API
  version: "2.0.0"
  description: Local OWASP ZAP target specification for authorised testing of this project.
servers:
  - url: https://host.docker.internal:3000
paths:
  /api/health:
    get:
      responses:
        "200":
          description: Health
  /api/auth/register:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
      responses:
        "201":
          description: Registered
        "400":
          description: Validation
  /api/auth/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login
        "401":
          description: Invalid
  /api/auth/me:
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
        "401":
          description: Unauthorised
  /api/gigs:
    get:
      responses:
        "200":
          description: List gigs
    post:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                price:
                  type: number
      responses:
        "201":
          description: Created
        "401":
          description: Unauthorised
  /api/gigs/mine:
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: My gigs
        "401":
          description: Unauthorised
  /api/gigs/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Gig
        "404":
          description: Not found
    put:
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                price:
                  type: number
      responses:
        "200":
          description: Updated
        "401":
          description: Unauthorised
    delete:
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "401":
          description: Unauthorised
  /api/bookings:
    post:
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gigId:
                  type: string
      responses:
        "201":
          description: Booked
        "401":
          description: Unauthorised
  /api/bookings/mine:
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: My bookings
        "401":
          description: Unauthorised
  /api/bookings/{id}/confirm:
    post:
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Confirmed
        "401":
          description: Unauthorised
  /api/transactions/mine:
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Income
        "401":
          description: Unauthorised
  /api/admin/gigs:
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin gigs
        "401":
          description: Unauthorised
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
