name: Static code analysis

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  analyse:
    name: Backend and frontend analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix client

      - name: Analyse backend and frontend
        run: npm run lint:report

      - name: Verify errors and warnings fail the analysis gate
        run: npm run analysis:verify-gate

      - name: Save analysis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: static-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/static-analysis/
            reports/gate-verification.json
          if-no-files-found: error
          retention-days: 90
