name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PORT: 3000
      MONGODB_URI: mongodb://127.0.0.1:27017/hustlehub
      JWT_EXPIRES_IN: 1h
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Generate CI JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run backend unit tests
        run: npm run test:backend

      - name: Run tax estimation tests
        run: npm run test:tax

      - name: Run logger tests
        run: npm run test:logger

      - name: Run Winston logging tests
        run: npm run test:logging

      - name: Build backend
        run: npm run build

      - name: Generate HTTPS certificates
        run: npm run certs

      - name: Start API and run integration tests
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -kfsS https://localhost:3000/api/health >/dev/null; then
              echo "API is healthy"
              npm run test:ci
              exit $?
            fi
            sleep 2
          done
          echo "API did not become healthy"
          exit 1

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: client

      - name: Run frontend tests
        run: npm test
        working-directory: client

      - name: Build frontend
        run: npm run build
        working-directory: client

  analysis:
    name: Static code analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix client

      - name: Analyse backend and frontend
        run: npm run lint:report

  docker:
    name: Docker Compose and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Write CI environment file
        run: |
          JWT_SECRET=$(openssl rand -hex 32)
          cat > .env <<EOF
          PORT=3000
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_IN=1h
          MONGODB_URI=mongodb://127.0.0.1:27017/hustlehub
          CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
          LOG_LEVEL=info
          TRUST_PROXY=true
          EOF

      - name: Build and start Docker Compose stack
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Confirm API, web, Grafana, and Loki are up
        run: |
          curl -kfsS https://localhost:3000/api/health
          curl -fsS -o /dev/null -w "%{http_code}" http://localhost:8080
          echo
          curl -fsS http://localhost:3001/api/health
          curl -fsS http://localhost:3100/ready

      - name: Run Newman against the container API
        run: npm run test:ci

      - name: Confirm Loki ingested API logs
        run: npm run test:loki

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          GRAFANA_URL: http://localhost:3001
          LOKI_QUERY_URL: http://localhost:3100
          E2E_SAVE_EVIDENCE: "1"

      - name: Upload Playwright and Grafana evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-docker-evidence-${{ github.run_id }}
          path: |
            reports/playwright
            test-results
            docs/evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
