services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - hustlehub_mongo:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/hustlehub
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "3000:3000"
    depends_on:
      - mongo

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://localhost:3000
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  hustlehub_mongo:
